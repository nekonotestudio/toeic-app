<div class="main">
  <div id="startScreen" class="start-screen">
    <h2>TOEIC 速読トレーナー</h2>
    <p>メール・チラシ・求人・お知らせなど</p>
    <p>TOEICに出るパッセージで速読力を鍛えよう！</p>
    <div class="start-features">
      <div class="feature-tag">📧 ビジネスメール</div>
      <div class="feature-tag">📄 宣伝チラシ</div>
      <div class="feature-tag">📋 求人広告</div>
      <div class="feature-tag">📢 お知らせ</div>
      <div class="feature-tag">⏱ 75秒タイマー</div>
      <div class="feature-tag">📊 スコア管理</div>
    </div>

    <button class="btn-start" onclick="startGame()">スタート！</button>
  </div>

  <div id="gameScreen" style="display:none">
    <div id="timeupBanner" style="display:none" class="timeup-banner">⏰ TIME UP！ — 正解を確認してください</div>
    <div class="reading-progress"><div class="reading-progress-fill" id="progressFill"></div></div>
    <div id="passageContainer"></div>
    <div class="actions">
      <div class="progress-text" id="progressText"></div>
      <button class="btn-next" id="btnNext" onclick="nextPassage()">次へ →</button>
    </div>
  </div>

  <div id="resultScreen" style="display:none" class="result-screen">
    <h2>お疲れさまでした！</h2>
    <div class="result-score" id="resultScore">0/0</div>
    <div class="result-comment" id="resultComment"></div>
    <button class="btn-restart" onclick="restartGame()">もう一度チャレンジ！</button>
  </div>
</div>

<script>
// PWA Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// PWA Install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').style.display = 'flex';
});
document.getElementById('installBtn')?.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner').style.display = 'none';
});

// ===== GAME STATE =====
let currentIndex = 0, order = [], answered = [], timer = null;
let timeLeft = 75, totalCorrect = 0, totalQuestions = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  order = shuffle([...Array(PASSAGES.length).keys()]).slice(0, 10);
  currentIndex = 0; totalCorrect = 0; totalQuestions = 0;
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('scoreBar').style.display = 'flex';
  updateScoreDisplay();
  showPassage();
}

function showPassage() {
  const p = PASSAGES[order[currentIndex]];
  document.getElementById('progressFill').style.width = (currentIndex / order.length * 100) + '%';
  document.getElementById('progressText').textContent = `${currentIndex + 1} / ${order.length}`;
  document.getElementById('timeupBanner').style.display = 'none';
  document.getElementById('btnNext').disabled = true;

  const gc = { email:'genre-email', flyer:'genre-flyer', notice:'genre-notice', job:'genre-job', schedule:'genre-schedule', memo:'genre-memo', ad:'genre-ad' };
  const qs = p.questions.map((q, qi) => `
    <div class="question-block" id="qblock${qi}">
      <div class="question-text">Q${qi+1}. ${q.q}</div>
      <div class="options">
        ${q.options.map((opt, oi) => `
          <button class="option-btn" id="opt${qi}_${oi}" onclick="selectAnswer(${qi},${oi})">
            <span class="opt-label">${['(A)','(B)','(C)','(D)'][oi]}</span>
            <span>${opt}</span>
          </button>`).join('')}
      </div>
      <div class="feedback" id="fb${qi}" style="display:none"></div>
    </div>`).join('');

  document.getElementById('passageContainer').innerHTML = `
    <span class="genre-badge ${gc[p.genre]||'genre-notice'}">${p.genreLabel}</span>
    <div class="passage-card">
      <div class="passage-title">${p.title}</div>
      <div class="passage-meta">${p.meta}</div>
      <div class="passage-body">${p.body}</div>
    </div>
    <div class="questions-section">
      <h3>設問 (Questions)</h3>${qs}
    </div>`;

  answered = new Array(p.questions.length).fill(false);
  window.scrollTo(0, 0);
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 75;
  updateTimerUI();
  timer = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timer); timeUp(); }
  }, 1000);
}

function updateTimerUI() {
  const el = document.getElementById('timerText');
  const circle = document.getElementById('timerCircle');
  circle.style.strokeDashoffset = 138.2 * (1 - timeLeft / 75);
  el.textContent = timeLeft;
  if (timeLeft <= 15) { el.className = 'timer-text warn'; circle.style.stroke = '#ff6b6b'; }
  else { el.className = 'timer-text'; circle.style.stroke = '#e8b84b'; }
}

function timeUp() {
  document.getElementById('timeupBanner').style.display = 'block';
  const p = PASSAGES[order[currentIndex]];
  p.questions.forEach((q, qi) => { if (!answered[qi]) revealAnswer(qi, q.answer, q.explanation); });
  document.getElementById('btnNext').disabled = false;
}

function selectAnswer(qi, oi) {
  if (answered[qi]) return;
  const q = PASSAGES[order[currentIndex]].questions[qi];
  answered[qi] = true;
  totalQuestions++;
  document.querySelectorAll(`#qblock${qi} .option-btn`).forEach(b => b.disabled = true);
  const fb = document.getElementById(`fb${qi}`);
  if (oi === q.answer) {
    document.getElementById(`opt${qi}_${oi}`).classList.add('correct');
    totalCorrect++;
    fb.className = 'feedback ok';
    fb.textContent = '✓ 正解！ ' + q.explanation;
  } else {
    document.getElementById(`opt${qi}_${oi}`).classList.add('wrong');
    document.getElementById(`opt${qi}_${q.answer}`).classList.add('reveal');
    fb.className = 'feedback ng';
    fb.textContent = '✗ 不正解。' + q.explanation;
  }
  fb.style.display = 'block';
  updateScoreDisplay();
  if (answered.every(Boolean)) { clearInterval(timer); document.getElementById('btnNext').disabled = false; }
}

function revealAnswer(qi, correctOi, explanation) {
  document.querySelectorAll(`#qblock${qi} .option-btn`).forEach(b => b.disabled = true);
  document.getElementById(`opt${qi}_${correctOi}`).classList.add('reveal');
  const fb = document.getElementById(`fb${qi}`);
  fb.className = 'feedback ng';
  fb.textContent = '時間切れ。' + (explanation || '');
  fb.style.display = 'block';
}

function updateScoreDisplay() {
  document.getElementById('scoreCorrect').textContent = totalCorrect;
  document.getElementById('scoreTotal').textContent = totalQuestions;
}

function nextPassage() {
  currentIndex++;
  if (currentIndex >= order.length) { showResult(); return; }
  showPassage();
}

function showResult() {
  clearInterval(timer);
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('scoreBar').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  const pct = totalQuestions > 0 ? Math.round(totalCorrect / totalQuestions * 100) : 0;
  document.getElementById('resultScore').textContent = `${totalCorrect} / ${totalQuestions}`;
  const comments = [
    [90, '🏆 素晴らしい！TOEICリーディング満点レベルです！'],
    [75, '👏 よくできました！あと少しで目標スコア達成！'],
    [60, '📚 まずまずです。もう一度チャレンジして強化しましょう！'],
    [0,  '💪 速読と精読のバランスを意識して練習を続けましょう！']
  ];
  const comment = comments.find(([t]) => pct >= t)[1];
  document.getElementById('resultComment').textContent = `${comment}（正解率 ${pct}%）`;
}

function restartGame() {
  document.getElementById('resultScreen').style.display = 'none';
  startGame();
}
</script>
